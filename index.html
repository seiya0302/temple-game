<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090a07"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest"><title>Temple Expedition Operations v4</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#050604;color:#f4e3b9;font-family:system-ui,-apple-system,sans-serif}
#app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;background:#090a07}
header{padding:max(8px,env(safe-area-inset-top)) 10px 7px;background:#12130d;border-bottom:1px solid #64502b;display:flex;justify-content:space-between;align-items:center}
.logo{font:800 12px Georgia;color:#e3b75b;letter-spacing:.1em}.stats{text-align:right;font-size:10px;line-height:1.4}
#world{position:relative;flex:1;overflow:hidden;background:radial-gradient(circle at 50% 18%,#6c542b,#2b2115 22%,#0b0d09 60%)}
.stone{position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(0deg,transparent 0 50px,#6d5730 51px 53px),repeating-linear-gradient(90deg,transparent 0 90px,#493b25 91px 93px)}
#queue{position:absolute;top:11%;left:5%;right:5%;height:13%;display:flex;align-items:center;gap:3px;overflow:hidden;padding:5px;border:1px solid #66502a;border-radius:8px;background:#0b0c09aa}
.qg{font-size:21px;animation:bob .8s infinite alternate}@keyframes bob{to{transform:translateY(-2px)}}
#status{position:absolute;top:3%;left:5%;right:5%;text-align:center;font-weight:900;color:#ffe8a9}
#vehicle{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);width:92%;height:45%;background:linear-gradient(#65694b,#363a28 60%,#202319);border:5px solid #26291d;border-radius:35px 35px 13px 13px;box-shadow:0 20px 35px #000;transition:.7s}
#vehicle.depart{transform:translate(-50%,-230px) scale(.45);opacity:.05}
.wind{position:absolute;top:10px;left:12%;right:12%;height:25%;background:#101612;border:4px solid #272c20;border-radius:20px 20px 6px 6px}
#seats{position:absolute;left:6%;right:6%;top:34%;bottom:10%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:4px}
.seat{position:relative;background:#25261d;border:1px solid #777154;border-radius:7px;display:flex;justify-content:center;align-items:center;font-size:23px}.seat.loaded{background:#4c4932}.bar{position:absolute;left:8%;right:8%;top:44%;height:6px;background:#aaa58d;border:1px solid #333;transform:rotate(-25deg);transform-origin:left;transition:.2s}.seat.ok .bar{transform:rotate(0);background:#78a96d}
#toast{position:absolute;left:10px;right:10px;bottom:52%;background:#090b09e8;border:1px solid #795f30;border-radius:9px;padding:8px;text-align:center;font-size:11px}
#event{position:absolute;left:8%;right:8%;top:27%;display:none;background:#561f19e8;border:1px solid #c25c45;padding:8px;border-radius:9px;text-align:center;font-weight:800;font-size:12px;z-index:5}
#panel{padding:7px 9px calc(7px + env(safe-area-inset-bottom));background:#0d0f0b;border-top:1px solid #594522}.meter{height:5px;background:#28261c;margin-bottom:6px;border-radius:5px;overflow:hidden}.meter div{height:100%;background:#d2a64c}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}button{min-height:46px;border:1px solid #80662f;border-radius:9px;background:linear-gradient(#332a18,#1c1910);color:#f5dfac;font-weight:800;font-size:12px}.primary{background:linear-gradient(#8a5c1d,#50310e)}.safe{border-color:#547b50}.danger{border-color:#8a473b;color:#ffc0b5}
#inspect,#brief{position:absolute;inset:0;background:#070806f5;z-index:12;display:none;padding:28px 16px;overflow:auto}h2{text-align:center;color:#e1b65b;font-family:Georgia}.ig{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.is{height:68px;border:1px solid #716c50;border-radius:8px;background:#29291f;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:21px}.is.ok{background:#263325;border-color:#7cad72}.is span{font-size:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.overlay{position:absolute;inset:0;background:#060705f3;z-index:20;display:flex;align-items:center;justify-content:center;padding:25px}.hidden{display:none}.card{text-align:center}.card h1{font:800 27px Georgia;color:#e2b65a}.card p{font-size:12px;line-height:1.65}.badge{display:inline-block;border:1px solid #71592f;border-radius:20px;padding:4px 9px;font-size:10px;margin:3px}
</style></head><body><div id="app">
<header><div class="logo">TEMPLE EXPEDITION<br>OPERATIONS v4</div><div class="stats">SCORE <b id="score">0</b><br>GUESTS <b id="gc">0</b> / WAIT <b id="wait">18</b>m<br>STREAK <b id="streak">0</b></div></header>
<section id="world"><div class="stone"></div><div id="status">LOADING PLATFORM</div><div id="queue"></div><div id="event"></div>
<div id="vehicle"><div class="wind"></div><div id="seats"></div></div><div id="toast">待機列からゲストを案内してください。</div>
<div id="inspect"><h2>SAFETY INSPECTION</h2><p style="text-align:center;font-size:11px">12席を1席ずつタップして確認</p><div class="ig" id="ig"></div><div class="actions"><button onclick="closeI()">戻る</button><button class="safe" onclick="finishI()">✓ 確認完了</button></div></div>
<div class="overlay" id="start"><div class="card"><h1>TEMPLE<br>EXPEDITION</h1><div><span class="badge">QUEUE</span><span class="badge">SAFETY</span><span class="badge">DISPATCH</span></div><p>混雑する古代神殿の乗降場を運営せよ。<br>待機列管理・12席安全確認・トラブル対応で高スコアを目指します。</p><button class="primary" onclick="startGame()">▶ OPEN ATTRACTION</button><p style="font-size:10px">🎵 オリジナルBGM / 60秒ループ</p></div></div>
<div class="overlay hidden" id="over"><div class="card"><h1>CLOSING TIME</h1><p id="result"></p><button class="primary" onclick="location.reload()">再挑戦</button></div></div>
</section>
<div id="panel"><div class="meter"><div id="timebar" style="width:100%"></div></div><div class="grid">
<button onclick="board()">👥 ゲスト案内</button><button class="safe" onclick="openI()">🔒 安全確認</button>
<button class="primary" onclick="dispatch()">🚙 DISPATCH</button><button class="danger" onclick="emergency()">🚨 トラブル対応</button></div></div>
<audio id="bgm" src="./temple_original_v4.wav" loop preload="auto"></audio></div>
<script>
const $=x=>document.getElementById(x);const faces=['👨🏻','👩🏻','🧑🏽','👩🏼','🧔🏻','👨🏼','👩🏽','🧑🏻','👩🏻','👨🏽','🧑🏼','👩🏼'];let score=0,total=0,wait=18,streak=0,time=100,running=false,loaded=false,checked=false,checks=Array(12).fill(false),problem=null,timer;
function seats(){let h='';for(let i=0;i<12;i++)h+=`<div class="seat ${loaded?'loaded':''} ${checks[i]?'ok':''}">${loaded?faces[i]+'<i class="bar"></i>':''}</div>`;$('seats').innerHTML=h}
function queue(){let n=Math.min(16,Math.max(4,Math.floor(wait/3)));$('queue').innerHTML=Array.from({length:n},(_,i)=>`<span class="qg">${faces[i%12]}</span>`).join('')}
function u(){$('score').textContent=score;$('gc').textContent=total;$('wait').textContent=wait;$('streak').textContent=streak;$('timebar').style.width=time+'%';queue()}function msg(x){$('toast').textContent=x}
function startGame(){$('start').classList.add('hidden');running=true;$('bgm').volume=.3;$('bgm').play().catch(()=>{});timer=setInterval(tick,700);u()}
function tick(){time-=.62;if(Math.random()<.16)wait=Math.min(90,wait+1);if(!problem&&Math.random()<.035)makeProblem();u();if(time<=0)end()}
function makeProblem(){problem=Math.random()<.5?'bag':'bar';$('event').style.display='block';$('event').textContent=problem==='bag'?'⚠️ 荷物が車両からはみ出しています':'⚠️ センサーが安全バー異常を検知';msg('トラブル対応が必要です。DISPATCHしないでください。');navigator.vibrate?.([70,40,70])}
function board(){if(!running)return;if(problem){msg('先にトラブルを解消してください。');return}if(loaded){msg('すでに12名乗車済みです。');return}loaded=true;checked=false;checks.fill(false);score+=25;wait=Math.max(5,wait-2);$('status').textContent='12 GUESTS LOADED';msg('12名乗車。全席の安全バーを確認。');seats();u()}
function openI(){if(!loaded){msg('先にゲストを乗車させてください。');return}$('inspect').style.display='block';ri()}
function ri(){let h='';for(let i=0;i<12;i++)h+=`<div class="is ${checks[i]?'ok':''}" onclick="ck(${i})">${faces[i]}<span>${checks[i]?'✓ LOCKED':'TAP TO CHECK'}</span></div>`;$('ig').innerHTML=h}
function ck(i){if(checks[i])return;checks[i]=true;score+=4;ri();seats();navigator.vibrate?.(10);u()}
function finishI(){if(!checks.every(Boolean)){msg('未確認席があります。');return}checked=true;score+=45;$('inspect').style.display='none';$('status').textContent='SAFETY CHECK ✓';msg('安全確認完了。DISPATCH！');u()}
function closeI(){$('inspect').style.display='none'}
function dispatch(){if(problem){score-=100;streak=0;msg('⚠️ 異常中です！非常停止してください。');navigator.vibrate?.(150);u();return}if(!loaded||!checked){score-=35;streak=0;msg('安全確認が完了していません。');u();return}streak++;let bonus=Math.min(100,streak*10);score+=150+bonus;total+=12;wait=Math.max(5,wait-4);loaded=false;checked=false;checks.fill(false);$('status').textContent='VEHICLE DISPATCHED +'+bonus;$('vehicle').classList.add('depart');msg('出発成功！連続安全運行ボーナス +'+bonus);u();setTimeout(()=>{$('vehicle').classList.remove('depart');$('status').textContent='NEXT VEHICLE READY';seats()},750)}
function emergency(){if(problem){score+=90;problem=null;$('event').style.display='none';$('status').textContent='PROBLEM CLEARED';msg('トラブル解消！運行を再開できます。');navigator.vibrate?.(30)}else{score-=15;wait+=2;msg('異常なし。不必要な停止で待ち時間増加。')}u()}
function end(){running=false;clearInterval(timer);$('bgm').pause();let r=score>1800?'S':score>1300?'A':score>800?'B':'C';$('result').innerHTML=`ランク <b>${r}</b><br>スコア ${Math.max(0,score)}<br>案内ゲスト ${total}名<br>最大連続安全運行 ${streak}<br>最終待ち時間 ${wait}分`;$('over').classList.remove('hidden')}
seats();u();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
