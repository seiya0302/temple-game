<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Temple Run Operations</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#171109">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Temple Ops">
<style>
:root{--bg:#0d0b08;--panel:#1b1710;--gold:#d8aa52;--text:#f3e5c5;--red:#b84632;--green:#5d9b63}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#070604;color:var(--text);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;height:100%}
#game{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;background:linear-gradient(#0c0a07,#171109)}
header{padding:max(10px,env(safe-area-inset-top)) 14px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #5e4827}
h1{font-size:15px;margin:0;letter-spacing:.08em;color:#f4cf80}
.stats{font-size:12px;text-align:right;line-height:1.45}
#scene{position:relative;flex:1;min-height:0;overflow:hidden;background:
radial-gradient(circle at 50% 28%,#594321 0 4%,#231a0f 17%,transparent 35%),
linear-gradient(180deg,#19130d 0%,#080706 100%)}
.temple{position:absolute;inset:0;opacity:.65;background:
linear-gradient(90deg,transparent 8%,#322514 8% 13%,transparent 13% 87%,#322514 87% 92%,transparent 92%),
repeating-linear-gradient(0deg,transparent 0 58px,#3b2c18 59px 61px)}
.skull{position:absolute;top:12%;left:50%;transform:translateX(-50%);font-size:54px;filter:drop-shadow(0 0 18px #c99738);transition:.3s}
.track{position:absolute;left:20%;right:20%;bottom:-5%;height:72%;clip-path:polygon(44% 0,56% 0,90% 100%,10% 100%);background:repeating-linear-gradient(0deg,#2d251b 0 8px,#0b0907 8px 26px)}
.car{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);width:145px;height:88px;background:#5c553d;border:4px solid #29251b;border-radius:18px 18px 10px 10px;box-shadow:0 10px 30px #000}
.car:before{content:"";position:absolute;left:15px;right:15px;top:12px;height:30px;background:#151713;border-radius:7px}
.lights{position:absolute;bottom:10px;left:12px;right:12px;display:flex;justify-content:space-between}
.light{width:18px;height:18px;border-radius:50%;background:#ffe49b;box-shadow:0 0 16px #ffd15a}
#event{position:absolute;top:4%;left:14px;right:14px;text-align:center;font-weight:800;font-size:18px;text-shadow:0 2px 5px #000}
#message{position:absolute;bottom:25%;left:16px;right:16px;background:#100d08dd;border:1px solid #80612f;border-radius:12px;padding:12px;text-align:center;font-size:14px;min-height:46px}
#controls{padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#100d08;border-top:1px solid #5e4827}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
button{border:1px solid #8c6a35;border-radius:12px;background:linear-gradient(#3a2b18,#21180e);color:#f9e5b8;font-weight:800;font-size:15px;min-height:54px;padding:8px;touch-action:manipulation}
button:active{transform:scale(.97);background:#5a3d1d}
button.primary{background:linear-gradient(#8d5b1d,#50300f);border-color:#d5a64f}
button.danger{border-color:#8e4133;color:#ffb8aa}
#bar{height:7px;background:#322718;border-radius:8px;overflow:hidden;margin-bottom:8px}
#fill{height:100%;width:100%;background:#c99c45;transition:width .2s}
.overlay{position:absolute;inset:0;background:#080604ed;display:flex;align-items:center;justify-content:center;padding:28px;z-index:10}
.card{text-align:center;max-width:360px}
.card h2{color:#efc46d;font-size:28px;margin:0 0 10px}.card p{line-height:1.65;color:#e7d7b5}
.hidden{display:none}
.small{font-size:12px;opacity:.75}
</style>
</head>
<body>
<div id="game">
<header>
<h1>CURSED TEMPLE<br>OPERATIONS</h1>
<div class="stats">SCORE <b id="score">0</b><br>GUESTS <b id="guests">0</b> / WAIT <b id="wait">15</b>m</div>
</header>
<div id="scene">
<div class="temple"></div><div class="skull" id="skull">💀</div><div class="track"></div>
<div id="event">魔宮ツアー運行中</div>
<div class="car"><div class="lights"><i class="light"></i><i class="light"></i></div></div>
<div id="message">次の車両を出発させよう。</div>
<div class="overlay" id="start">
 <div class="card"><h2>CURSED TEMPLE</h2><p>古代神殿のライド運営を任されたあなた。<br>安全確認、ゲスト誘導、車両出発を判断し、閉園まで運行を守れ。</p><button class="primary" onclick="startGame()">ツアーを開始</button><p class="small">スマホ縦画面推奨 / オリジナル・ファンゲーム</p></div>
</div>
<div class="overlay hidden" id="over"><div class="card"><h2 id="overTitle">運行終了</h2><p id="result"></p><button class="primary" onclick="location.reload()">もう一度</button></div></div>
</div>
<div id="controls">
<div id="bar"><div id="fill"></div></div>
<div class="row"><button onclick="act('load')">👥 ゲスト誘導</button><button onclick="act('check')">🔒 安全確認</button></div>
<div class="row"><button class="primary" onclick="act('dispatch')">🚙 DISPATCH</button><button class="danger" onclick="act('stop')">🚨 非常停止</button></div>
</div>
</div>
<script>
let score=0,guests=0,wait=15,time=100,running=false,loaded=false,checked=false,eventType=null,timer;
const $=id=>document.getElementById(id);
function msg(t){$('message').textContent=t}
function update(){ $('score').textContent=score;$('guests').textContent=guests;$('wait').textContent=wait;$('fill').style.width=time+'%' }
function startGame(){ $('start').classList.add('hidden');running=true;msg('ゲストを車両へ誘導してください。');timer=setInterval(tick,700) }
function tick(){
 if(!running)return; time-=1.15; if(Math.random()<.035&&!eventType)randomEvent();
 if(time<=0){finish(true);return}
 if(Math.random()<.08)wait=Math.min(120,wait+1);
 update()
}
function randomEvent(){
 const r=Math.random();
 if(r<.34){eventType='bar';$('event').textContent='⚠️ 安全バー異常';msg('安全バーの確認が必要です。非常停止してください！');}
 else if(r<.67){eventType='delay';$('event').textContent='⚠️ 乗車遅延';msg('ゲストの乗車に時間がかかっています。誘導してください。');}
 else {eventType='curse';$('event').textContent='💀 神殿の呪い！';$('skull').style.transform='translateX(-50%) scale(1.35)';msg('呪いの演出発生！安全確認をして運行を継続。');}
}
function act(a){
 if(!running)return;
 if(a==='load'){
  if(eventType==='delay'){eventType=null;score+=80;$('event').textContent='魔宮ツアー運行中';msg('乗車遅延を解消！');return}
  if(loaded){score-=10;msg('すでに乗車済みです。');return}
  loaded=true;checked=false;score+=15;msg('12名乗車。安全確認をしてください。');
 }
 if(a==='check'){
  if(!loaded){score-=10;msg('まだゲストが乗車していません。');return}
  checked=true;score+=20;
  if(eventType==='curse'){eventType=null;score+=70;$('event').textContent='魔宮ツアー運行中';$('skull').style.transform='translateX(-50%)';msg('安全確認完了。呪いを突破！出発できます。')}
  else msg('安全確認OK。DISPATCH！');
 }
 if(a==='dispatch'){
  if(eventType==='bar'){score-=100;msg('異常発生中に出発しようとしました！');finish(false);return}
  if(!loaded||!checked){score-=60;msg('安全確認不足！運行停止。');finish(false);return}
  guests+=12;score+=120+Math.max(0,40-wait);wait=Math.max(5,wait-3);loaded=false;checked=false;
  msg('車両出発！ +12名　次のゲストを誘導。');
 }
 if(a==='stop'){
  if(eventType==='bar'){eventType=null;score+=120;$('event').textContent='魔宮ツアー運行中';msg('非常停止成功。異常を解消し、安全に運行再開！')}
  else {score-=25;wait+=3;msg('異常なし。不要な停止で待ち時間が増えました。')}
 }
 update()
}
function finish(success){
 running=false;clearInterval(timer);$('over').classList.remove('hidden');
 let rank=score>1700?'S':score>1200?'A':score>750?'B':'C';
 $('overTitle').textContent=success?'閉園！運行完了':'運行中止';
 $('result').innerHTML=`ランク <b>${rank}</b><br>スコア ${Math.max(0,score)}<br>案内ゲスト ${guests}名<br>最終待ち時間 ${wait}分<br><br>${success?'神殿の一日を守り抜きました。':'安全運行を最優先に、もう一度挑戦しよう。'}`;
}
update();
</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(console.error);
  });
}
</script>

</body></html>
